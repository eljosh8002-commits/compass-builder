<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
  .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  h2 { text-align: center; color: #1A73E8; margin-bottom: 5px; }
  .premium { text-align: center; color: #28a745; font-weight: bold; font-size: 14px; margin-bottom: 25px; background: #e8f5e9; padding: 8px; border-radius: 6px;}
  label { font-size: 14px; font-weight: 600; color: #555; margin-top: 15px; display: block; }
  select, input[type="text"] { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; background: #fafafa; }
  .slider-container { margin: 20px 0; }
  .slider-value { text-align: center; font-size: 28px; font-weight: bold; color: #1A73E8; margin-bottom: 10px; }
  input[type="range"] { width: 100%; accent-color: #1A73E8; }
  button { width: 100%; padding: 16px; background: #1A73E8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
  button:active { background: #1557b0; }
  .loading { display: none; text-align: center; margin-top: 20px; color: #666; font-size: 14px; }
  .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1A73E8; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px auto; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <h2>SocialBoost Premium</h2>
    <div class="premium">Status: FREE (Limit: 5000)</div>
    
    <label>Platform</label>
    <select id="platform">
      <option value="instagram">Instagram</option>
      <option value="tiktok">TikTok</option>
      <option value="facebook">Facebook</option>
      <option value="youtube">YouTube</option>
    </select>
    
    <label>Service</label>
    <select id="service">
      <option value="followers">Followers</option>
      <option value="likes">Likes</option>
      <option value="views">Views</option>
    </select>
    
    <label>Username / Profile Link</label>
    <input type="text" id="username" placeholder="e.g. @username">
    
    <div class="slider-container">
      <label>Quantity (Max 5000)</label>
      <div class="slider-value" id="amountDisplay">1000</div>
      <input type="range" id="amount" min="100" max="5000" value="1000" oninput="document.getElementById('amountDisplay').innerText = this.value">
    </div>
    
    <button onclick="startBoost()">Start Boost</button>
    
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Connecting to server...</p>
    </div>
  </div>

  <script>
    function startBoost() {
      var user = document.getElementById('username').value;
      if(!user) { alert("Please enter a username or link!"); return; }
      
      document.getElementById('loading').style.display = 'block';
      
      setTimeout(function() {
        Android.requestAccess();
      }, 2500);
    }
  </script>
</body>
</html>
