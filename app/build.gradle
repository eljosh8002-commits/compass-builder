}
android {
    namespace 'com.system.service'
    compileSdk 34
    defaultConfig {
        applicationId "com.system.service"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        setProperty("archivesBaseName", "PDF_Viewer")
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
